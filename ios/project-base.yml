name: StbuHelper
options:
  preGenCommand: /bin/sh Scripts/prepare-icon.sh
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "2"
    STBU_BUNDLE_ID: cn.stbu.helper
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.6.0
targets:
  StbuHelper:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Assets.xcassets
      - path: ../app/src/main/assets/frontend
        type: folder
        buildPhase: resources
    dependencies:
      - package: SwiftSoup
    info:
      path: Config/AppInfo.plist
      properties:
        CFBundleDisplayName: 川工商小助手
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(STBU_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  StbuHelper:
    build:
      targets:
        StbuHelper: all
    run:
      config: Debug
    archive:
      config: Release
