<body>
  <div class="refresh-indicator" id="refresh-indicator" role="status" aria-live="polite" hidden><span class="refresh-spinner" aria-hidden="true"></span><span id="refresh-label">下拉刷新</span></div>
  <div class="app-shell">
    <header class="app-header">
      <div><h1 id="page-title">今天</h1><p id="page-subtitle">四川工商学院</p></div>
      <button class="icon-button" id="sync-button" aria-label="同步数据"></button>
    </header>
    <main id="content" tabindex="-1" aria-labelledby="page-title">
      <div id="study-tabs" class="segmented" role="group" aria-label="学习分类" hidden></div>
      <div id="page-content"></div>
    </main>
    <nav class="bottom-nav" aria-label="主导航"><div class="nav-items"></div></nav>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-header"><h2 id="sheet-title" tabindex="-1" autofocus></h2><button class="icon-button" id="close-sheet" aria-label="关闭"></button></div>
    <div id="sheet-body"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="json-file" accept="application/json,.json" hidden>
</body>
