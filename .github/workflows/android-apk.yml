name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check Android SDK
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Prepare release signing
        if: inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          signing_keys = {
              "storePassword": "ANDROID_KEYSTORE_PASSWORD",
              "keyAlias": "ANDROID_KEY_ALIAS",
              "keyPassword": "ANDROID_KEY_PASSWORD",
          }
          for secret in ("ANDROID_KEYSTORE_BASE64", *signing_keys.values()):
              if not os.environ.get(secret, "").strip():
                  raise SystemExit(f"::error::Missing GitHub Actions secret {secret}.")

          try:
              encoded = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
              data = base64.b64decode(encoded, validate=True)
          except ValueError:
              raise SystemExit("::error::ANDROID_KEYSTORE_BASE64 is not valid Base64.")

          keystore = Path(os.environ["RUNNER_TEMP"]) / "stbu-helper-ci.jks"
          keystore.write_bytes(data)
          properties = {"storeFile": str(keystore)}
          properties.update({key: os.environ[secret] for key, secret in signing_keys.items()})

          def java_value(value):
              utf16 = value.encode("utf-16-be")
              return "".join(f"\\u{utf16[i:i+2].hex()}" for i in range(0, len(utf16), 2))

          Path("keystore.properties").write_text(
              "".join(f"{key}={java_value(value)}\n" for key, value in properties.items()),
              encoding="ascii",
          )
          PY

      - name: Build and verify APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          case "$BUILD_TYPE" in
            debug) task=publishDebug; apk_dir=app/Debug ;;
            release) task=publishRelease; apk_dir=app/Release ;;
            *) echo "::error::Unsupported build type."; exit 1 ;;
          esac
          bash ./gradlew ":app:$task" --no-daemon --console=plain

          shopt -s nullglob
          apks=("$apk_dir"/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one APK in $apk_dir."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "${apks[0]}"
          cp -- "${apks[0]}" "$RUNNER_TEMP/StbuHelper-$BUILD_TYPE.apk"

      - name: Remove temporary signing files
        if: ${{ always() && inputs.build_type == 'release' }}
        run: rm -f -- keystore.properties "$RUNNER_TEMP/stbu-helper-ci.jks"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/StbuHelper-${{ inputs.build_type }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
